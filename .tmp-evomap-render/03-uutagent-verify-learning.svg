<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900">
<defs><style>
.title{font:700 34px 'Noto Sans CJK TC','Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:18px 'Noto Sans CJK TC','Segoe UI',Arial,sans-serif;fill:#475569}.h{font:700 22px 'Noto Sans CJK TC','Segoe UI',Arial,sans-serif;fill:#0f172a}.t{font:16px 'Noto Sans CJK TC','Segoe UI',Arial,sans-serif;fill:#0f172a}.s{font:13px 'Noto Sans CJK TC','Segoe UI',Arial,sans-serif;fill:#475569}.pill{font:700 14px 'Noto Sans CJK TC','Segoe UI',Arial,sans-serif;fill:#fff}.box{font:600 14px 'Noto Sans CJK TC','Segoe UI',Arial,sans-serif}.mono{font:14px 'Consolas',monospace;fill:#334155}
</style></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="80" y="75" class="title">UutAgent：Verify 機制與狀態機</text>
<text x="80" y="110" class="sub">verify_fail_count 追蹤 → 2 次失敗觸發 forced replan</text>

<!-- Left side: Verify mechanism -->
<rect x="80" y="150" width="720" height="350" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="110" y="185" class="h">verify 條件觸發流程</text>

<text x="110" y="225" class="t">current_task.md 步驟可含 verify: 條件：</text>
<rect x="110" y="240" width="660" height="55" rx="8" fill="#1e3a8a" style="opacity:0.06"/>
<text x="130" y="262" class="mono">- verify: On the Domain network page, the Microsoft Defender Firewall toggle shows On</text>

<text x="110" y="315" class="t">當 agent 宣告 status = "done"：</text>
<text x="130" y="345" class="t">1. Loop parse 所有 - verify: 條件</text>
<text x="130" y="373" class="t">2. 發出獨立 stateless verify LLM call（帶截圖）</text>
<text x="130" y="401" class="t">3. Verify LLM 回傳 YES/NO + 說明</text>
<text x="130" y="429" class="t">4. verify_fail_count = 0 → finalize() → Phase 2 Teardown</text>
<text x="130" y="457" class="t">   verify_fail_count > 0 → 繼續 loop，agent 自行修正</text>

<text x="110" y="488" class="s">verify LLM 使用獨立 system prompt，不走 instructor schema，直接解析文字回傳 YES/NO。</text>

<!-- Right side: State machine -->
<rect x="840" y="150" width="680" height="350" rx="20" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="870" y="185" class="h">verify_fail_count 狀態機</text>

<!-- state boxes -->
<rect x="870" y="220" width="160" height="80" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="950" y="253" font-size="18" font-weight="700" fill="#16a34a" text-anchor="middle">verify → YES</text>
<text x="950" y="277" font-size="13" fill="#475569" text-anchor="middle">通過</text>

<text x="1040" y="255" font-size="22" fill="#94a3b8" text-anchor="middle">→</text>

<rect x="1070" y="220" width="160" height="80" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="1150" y="253" font-size="18" font-weight="700" fill="#3b82f6" text-anchor="middle">count = 0</text>
<text x="1150" y="277" font-size="13" fill="#475569" text-anchor="middle">→ finalize()</text>

<text x="870" y="335" class="t" style="font-size:15px; fill:#eab308">verify → NO：</text>
<text x="870" y="365" class="t">count += 1</text>
<text x="870" y="395" class="t">if count &lt; 2：feedback 給 LLM，繼續 loop</text>
<text x="870" y="425" class="t">if count ≥ 2：</text>

<rect x="870" y="440" width="620" height="50" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
<text x="890" y="468" class="box" style="fill:#d97706">_force_verify_replan()</text>
<text x="1090" y="468" class="s" style="fill:#92400e">獨立 LLM call 重寫 verify 條件 → 重置 count → 繼續</text>

<!-- Learning system -->
<rect x="80" y="540" width="720" height="300" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="110" y="575" class="h">學習系統：reflection / frustration</text>

<rect x="110" y="605" width="660" height="105" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="130" y="635" class="box" style="fill:#1d4ed8">append_reflection()</text>
<text x="280" y="635" class="s">REPLAN 時觸發</text>
<text x="130" y="663" class="t">寫入：reflection/{task_id}.md</text>
<text x="130" y="691" class="t">內容：每個 REPLAN 的原因與步驟，附上 propose.md 和 task_journal.md</text>

<rect x="110" y="730" width="660" height="95" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="130" y="760" class="box" style="fill:#c2410c">write_frustration()</text>
<text x="310" y="760" class="s">final_status == "UNABLE" 時觸發</text>
<text x="130" y="790" class="t">寫入：frustration/{task_id}.md</text>
<text x="130" y="818" class="t">內容：失敗原因、propose.md、design.md、中斷時的 current_task.md</text>

<!-- Tool chain -->
<rect x="840" y="540" width="680" height="300" rx="20" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
<text x="870" y="575" class="h">工具分層架構</text>

<rect x="870" y="610" width="620" height="50" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="885" y="640" class="box" style="fill:#1d4ed8">LLM 決策層</text>
<text x="1040" y="640" class="s">ActionResponse（instructor + Pydantic）</text>

<text x="1090" y="635" font-size="16" fill="#94a3b8" text-anchor="middle">↓</text>

<rect x="870" y="675" width="620" height="50" rx="10" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
<text x="885" y="705" class="box" style="fill:#0d9488">Dispatcher</text>
<text x="990" y="705" class="s">agent/dispatcher.py → ActionType routing</text>

<text x="1090" y="700" font-size="16" fill="#94a3b8" text-anchor="middle">↓</text>

<rect x="870" y="740" width="620" height="50" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="885" y="770" class="box" style="fill:#374151">Python Tools</text>
<text x="1040" y="770" class="s">mouse, keyboard, screenshot, bbox, command, files</text>

<text x="1090" y="765" font-size="16" fill="#94a3b8" text-anchor="middle">↓</text>

<rect x="870" y="805" width="620" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="885" y="835" class="box" style="fill:#92400e">PowerShell</text>
<text x="1040" y="835" class="s">uut_op.ps1, send_key.ps1, screenshot.ps1</text>

<rect x="80" y="795" width="1440" height="56" rx="18" fill="#0f172a"/>
<text x="110" y="830" class="pill">verify: 條件是 agent 的品質閘門；frustration 是失敗後的解剖標本；兩者都是 Learning Phase 的產出。</text>
</svg>